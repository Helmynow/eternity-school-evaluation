name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eternity_school_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Set up Python path
      run: |
        echo "PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}/backend" >> $GITHUB_ENV
    
    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
    
    - name: Initialize test database
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eternity_school_test
        SENTRY_DSN: ""
        ENVIRONMENT: test
        EMAIL_ENABLED: "false"
        PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      run: |
        python -c "import sys; import os; sys.path.insert(0, os.path.join(os.getcwd(), 'backend')); from database import Database; db = Database(); db.create_tables()" || echo "Database initialization completed (some tables may already exist)"
    
    - name: Run tests (skip API integration tests that require server)
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eternity_school_test
        SENTRY_DSN: ""
        ENVIRONMENT: test
        EMAIL_ENABLED: "false"
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      run: |
        export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/backend"
        python -c "import sys; print('Python path:', sys.path)"
        pytest tests/ -v --cov=backend --cov-report=xml --tb=short --ignore=tests/test_api_integration.py -m "not api"
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
