# Supabase Configuration for Eternity School Evaluation System
# This config is for local development. For remote projects, use: supabase link --project-ref ywcfqlyhesnikclesgpr

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://eternity-school-evaluation.vercel.app"]
jwt_expiry = 3600
enable_signup = true

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true

[functions]
verify_jwt = { enabled = true }

